# ==============================================
# Nginx 性能优化配置
# ==============================================

user nginx;
worker_processes auto;  # 自动设置为CPU核心数
worker_rlimit_nofile 65535;  # 增加文件描述符限制

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;  # 每个worker的最大连接数
    use epoll;  # 使用epoll事件模型
    multi_accept on;  # 允许一次接受多个连接
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==============================================
    # 日志格式
    # ==============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ==============================================
    # 基础性能优化
    # ==============================================
    sendfile on;  # 高效文件传输
    tcp_nopush on;  # 减少网络包数量
    tcp_nodelay on;  # 禁用Nagle算法
    keepalive_timeout 65;  # 长连接超时时间
    keepalive_requests 100;  # 长连接最大请求数
    types_hash_max_size 2048;  # 类型哈希表大小
    server_tokens off;  # 隐藏Nginx版本号

    # ==============================================
    # 缓冲区设置
    # ==============================================
    client_body_buffer_size 128k;  # 请求体缓冲区
    client_max_body_size 100m;  # 最大请求体大小
    client_header_buffer_size 4k;  # 请求头缓冲区
    large_client_header_buffers 4 32k;  # 大请求头缓冲区

    # ==============================================
    # Gzip 压缩
    # ==============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;  # 压缩级别 1-9
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        font/woff
        font/woff2;
    gzip_min_length 1000;  # 最小压缩文件大小
    gzip_disable "msie6";  # 禁用IE6的gzip

    # ==============================================
    # Brotli 压缩（如果安装了brotli模块）
    # ==============================================
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==============================================
    # 代理设置
    # ==============================================
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    proxy_buffer_size 4k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ==============================================
    # FastCGI 缓存（如果需要）
    # ==============================================
    fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=fastcgi_cache:100m inactive=60m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;

    # ==============================================
    # 代理缓存
    # ==============================================
    proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=proxy_cache:100m max_size=10g inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 302 10m;
    proxy_cache_valid 404 1m;

    # ==============================================
    # 限流配置
    # ==============================================
    # 限制请求速率
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # 限制连接数
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==============================================
    # Upstream 配置
    # ==============================================
    upstream backend {
        least_conn;  # 最少连接数负载均衡
        keepalive 32;  # 保持32个长连接

        server backend:3000 max_fails=3 fail_timeout=30s weight=1;
        # 如果有多个后端实例，可以添加更多server
        # server backend2:3000 max_fails=3 fail_timeout=30s weight=1;
    }

    # ==============================================
    # 主服务器配置
    # ==============================================
    server {
        listen 80;
        server_name _;

        # 重定向到HTTPS（生产环境启用）
        # return 301 https://$server_name$request_uri;

        # 根目录
        root /usr/share/nginx/html;
        index index.html;

        # ==============================================
        # 静态文件缓存
        # ==============================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML文件不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ==============================================
        # API 代理
        # ==============================================
        location /api/ {
            # 限流
            limit_req zone=req_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            # 代理到后端
            proxy_pass http://backend/;

            # 代理缓存（谨慎使用，只缓存GET请求）
            proxy_cache proxy_cache;
            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status;

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ==============================================
        # 健康检查端点（不缓存）
        # ==============================================
        location /api/monitoring/health {
            proxy_pass http://backend/monitoring/health;
            proxy_cache off;
        }

        # ==============================================
        # WebSocket 支持
        # ==============================================
        location /ws/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ==============================================
        # SPA 路由处理
        # ==============================================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ==============================================
        # 安全headers
        # ==============================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ==============================================
        # 错误页面
        # ==============================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }

    # ==============================================
    # HTTPS 服务器配置（生产环境）
    # ==============================================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL证书
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL优化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 其他配置与HTTP相同...
        include /etc/nginx/conf.d/common.conf;
    }
}
